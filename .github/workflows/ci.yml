name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Node 24 / SQLite and PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bandwagon
          POSTGRES_PASSWORD: bandwagon_ci
          POSTGRES_DB: bandwagon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: SQLite integration tests
        run: npm test
      - name: PostgreSQL integration tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://bandwagon:bandwagon_ci@localhost:5432/bandwagon_test
